<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>DeepSeek Chat</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191c22;--line:#303540;--text:#f2f3f5;--muted:#9ba3b2;--accent:#718cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,sans-serif}.app{height:100dvh;display:grid;grid-template-columns:260px 1fr}aside{background:#15171c;border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px}.brand{font-size:19px;font-weight:700}.note{margin-top:auto;color:var(--muted);font-size:12px}main{min-width:0;display:flex;flex-direction:column}header{min-height:64px;border-bottom:1px solid var(--line);padding:9px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.model-info{display:grid;line-height:1.35}.model-info small{color:var(--muted);font-size:11px}.response-meta{color:var(--muted);font-size:11px;margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}.response-meta span{background:#20242c;padding:3px 7px;border-radius:6px}.chat{flex:1;overflow:auto;padding:24px 16px}.messages{max-width:820px;margin:auto;display:grid;gap:20px}.welcome{text-align:center;margin:auto;padding:15vh 10px;color:var(--muted)}.welcome h1{color:var(--text)}.message{display:flex;gap:12px}.avatar{flex:none;width:30px;height:30px;border-radius:10px;background:#292e3a;display:grid;place-items:center}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:4px 0}.user .bubble{background:#293653;border-radius:13px;padding:10px 14px}.composer-wrap{padding:12px 16px 20px}.composer{max-width:820px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}textarea,input,select,button{font:inherit}textarea{width:100%;resize:vertical;min-height:60px;background:transparent;border:0;outline:0;color:var(--text)}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#252a34;color:var(--text)}.primary{background:var(--accent);border:0}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.hint{font-size:12px;color:var(--muted)}dialog{width:min(540px,calc(100% - 28px));background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:20px}dialog::backdrop{background:#000a}label{display:grid;gap:6px;margin:14px 0;color:var(--muted);font-size:13px}input,select,.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text)}.field{min-height:130px}.actions{display:flex;gap:8px}@media(max-width:700px){.app{grid-template-columns:1fr}aside{display:none}header{padding:0 14px}.chat{padding:18px 12px}.composer-wrap{padding:10px 12px 14px}}
</style></head><body><div class="app"><aside><div class="brand">◈ DeepSeek Chat</div><button id="new">＋ 新建对话</button><div class="hint">纯静态网页 · GitHub Pages</div><div class="note">API Key 只保存在当前标签页内存中。不要在公共设备上输入密钥。</div></aside><main><header><div class="model-info"><strong id="modelName">DeepSeek Chat</strong><small id="modelInfo">通用对话模型 · 快速响应</small></div><div class="actions"><button id="settingsBtn">设置</button><button id="clear">清空</button></div></header><section class="chat" id="chat"><div class="messages" id="messages"><div class="welcome" id="welcome"><h1>有什么可以帮你？</h1><p>输入消息，开始与 DeepSeek 对话。</p></div></div></section><div class="composer-wrap"><div class="composer"><textarea id="prompt" rows="2" placeholder="给 DeepSeek 发送消息…"></textarea><div class="bottom"><span class="hint">Enter 发送 · Shift + Enter 换行</span><div class="actions"><button id="stop" hidden>停止</button><button class="primary" id="send">发送 ↑</button></div></div></div></div></main></div>
<dialog id="settings"><h3>连接与提示词设置</h3><label>DeepSeek API Key<input id="key" type="password" placeholder="粘贴 API Key" autocomplete="off"></label><label>模型<select id="model"><option value="deepseek-chat">deepseek-chat</option><option value="deepseek-reasoner">deepseek-reasoner</option></select></label><label>系统提示词<textarea class="field" id="system">你是一个有帮助、诚实、清晰的中文 AI 助手。</textarea></label><p class="hint">API Key、提示词和模型会保存在当前浏览器的本地存储中。请勿在公用设备上保存密钥。</p><div class="actions" style="justify-content:flex-end"><button id="close">取消</button><button class="primary" id="save">保存设置</button></div></dialog>
<script>
(()=>{const $=id=>document.getElementById(id),API='https://api.deepseek.com/chat/completions';let key=localStorage.getItem('ds_api_key')||'',history=[],controller=null,busy=false;const defaultSystem='你是一个有帮助、诚实、清晰的中文 AI 助手。';$('model').value=localStorage.ds_model||'deepseek-chat';$('system').value=localStorage.ds_system||defaultSystem;function modelLabel(){let reasoning=$('model').value==='deepseek-reasoner';$('modelName').textContent=reasoning?'DeepSeek Reasoner':'DeepSeek Chat';$('modelInfo').textContent=reasoning?'深度推理模型 · 适合复杂逻辑与数学问题':'通用对话模型 · 适合日常问答与写作'}modelLabel();function settings(){$('key').value=key;$('settings').showModal()}function add(role,content){$('welcome')?.remove();let w=document.createElement('div');w.className='message '+role;let a=document.createElement('div');a.className='avatar';a.textContent=role==='user'?'你':'AI';let b=document.createElement('div');b.className='bubble';b.textContent=content;w.append(a,b);$('messages').append(w);$('chat').scrollTop=$('chat').scrollHeight;return b}function addMeta(out,items){let m=document.createElement('div');m.className='response-meta';items.forEach(t=>{let x=document.createElement('span');x.textContent=t;m.append(x)});out.parentElement.append(m)}function fresh(){controller?.abort();history=[];$('messages').innerHTML='<div class="welcome" id="welcome"><h1>有什么可以帮你？</h1><p>输入消息，开始与 DeepSeek 对话。</p></div>';busy=false;buttons()}function buttons(){$('send').disabled=busy;$('send').textContent=busy?'生成中…':'发送 ↑';$('stop').hidden=!busy}async function send(){let q=$('prompt').value.trim();if(!q||busy)return;if(!key){settings();alert('请先填写 API Key');return}$('prompt').value='';history.push({role:'user',content:q});add('user',q);let out=add('assistant','');controller=new AbortController();busy=true;buttons();let started=performance.now(),usage=null,actualModel=$('model').value,finishReason='未知';try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:$('model').value,messages:[{role:'system',content:$('system').value},...history],stream:true,stream_options:{include_usage:true}}),signal:controller.signal});if(!r.ok){let e=await r.json().catch(()=>({}));throw Error(e.error?.message||'HTTP '+r.status)}let reader=r.body.getReader(),decoder=new TextDecoder(),buf='',answer='';while(true){let {value,done}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});let lines=buf.split('\n');buf=lines.pop();for(let line of lines){line=line.trim();if(!line.startsWith('data:'))continue;let d=line.slice(5).trim();if(d==='[DONE]')continue;try{let j=JSON.parse(d);if(j.model)actualModel=j.model;if(j.usage)usage=j.usage;if(j.choices?.[0]?.finish_reason)finishReason=j.choices[0].finish_reason;answer+=j.choices?.[0]?.delta?.content||'';out.textContent=answer;$('chat').scrollTop=$('chat').scrollHeight}catch{}}}if(!answer)answer='（模型没有返回文本内容）';out.textContent=answer;history.push({role:'assistant',content:answer});let ms=Math.round(performance.now()-started),meta=['模型 '+actualModel,'耗时 '+(ms/1000).toFixed(2)+' 秒','结束原因 '+finishReason];if(usage)meta.push('输入 '+(usage.prompt_tokens??'—')+' tokens','输出 '+(usage.completion_tokens??'—')+' tokens','总计 '+(usage.total_tokens??'—')+' tokens');else meta.push('Token 用量暂不可用');addMeta(out,meta)}catch(e){if(e.name==='AbortError'){let partial=out.textContent||'已停止生成。';out.textContent=partial;history.push({role:'assistant',content:partial});addMeta(out,['模型 '+actualModel,'已手动停止','耗时 '+((performance.now()-started)/1000).toFixed(2)+' 秒'])}else{out.textContent='请求出错：'+e.message+'\n请检查 API Key、余额、模型和网络。';out.parentElement.style.color='#ff8585';history.pop()}}finally{controller=null;busy=false;buttons()}}$('settingsBtn').onclick=settings;$('close').onclick=()=>$('settings').close();$('save').onclick=()=>{key=$('key').value.trim();if(key)localStorage.setItem('ds_api_key',key);else localStorage.removeItem('ds_api_key');localStorage.ds_model=$('model').value;localStorage.ds_system=$('system').value;modelLabel();$('settings').close()};$('model').onchange=modelLabel;$('send').onclick=send;$('stop').onclick=()=>controller?.abort();$('new').onclick=$('clear').onclick=fresh;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}})();
</script></body></html>
